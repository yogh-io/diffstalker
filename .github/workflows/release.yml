name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write  # Required for OIDC
  contents: write  # Required for GitHub release

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - run: bun install --frozen-lockfile
      # Type-check all packages (tsc -b: core -> cli, core -> daemon).
      # bun test strips types without checking, so this is the only gate
      # that catches type errors in core/daemon before publish.
      - run: bun run build
      # Self-contained production bundles: cli bundles core+client, daemon
      # bundles core. Each keeps only its own npm deps external.
      - run: bun run build:prod
        working-directory: packages/cli
      - run: bun run build:prod
        working-directory: packages/daemon
      - run: bun run test
      # Publish BOTH with `bun publish`: bun resolves the cli's
      # `diffstalkerd: workspace:*` to the concrete version, which plain
      # `npm publish` does NOT (it would ship an uninstallable workspace:*).
      # Order matters — the cli depends on diffstalkerd, so publish the
      # daemon first.
      - run: bun publish --access public
        if: ${{ !env.ACT }}
        working-directory: packages/daemon
      - run: bun publish --access public
        if: ${{ !env.ACT }}
        working-directory: packages/cli
      # After publish: a failure here must not abort the release itself
      - run: bun run metrics:snapshot
      - name: Commit metrics snapshot
        if: ${{ !env.ACT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add metrics/
          git commit -m "Add metrics snapshot for ${{ github.ref_name }}" || true
          git push origin HEAD:main

      - name: Create GitHub Release
        if: ${{ !env.ACT }}
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
