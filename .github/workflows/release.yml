name: Release

on:
  push:
    tags:
      - 'v*'

# Publishable packages, in DEPENDENCY ORDER (a dependency before its dependents).
# This one list drives the whole flow: build:prod + pack (gate job) and publish
# (publish job) all iterate it. Adding the coming web http package is a one-line
# change here — nothing else in this file needs to know about it.
#   - `dir`  : workspace directory (build:prod + bun pm pack run here)
#   - `name` : published npm package name (used for the idempotency check + tarball glob)
env:
  # Space-separated "dir:name" pairs. daemon before cli: the cli depends on
  # diffstalkerd (workspace:*, published as the exact version), so the daemon
  # must reach the registry first. Add e.g. "packages/web:@diffstalker/web" here.
  PUBLISHABLE: "packages/daemon:diffstalkerd packages/cli:diffstalker"

jobs:
  # ── Gate ──────────────────────────────────────────────────────────────────
  # Everything must build and test green BEFORE anything ships. This job type-
  # checks all packages, prod-bundles + packs each publishable one, runs the
  # full test suite, and uploads the tarballs. If ANY step fails the job fails
  # and `publish` (which `needs` it) never starts — no partial release.
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      # tsc -b across all packages (core -> cli, core -> daemon). bun test strips
      # types without checking, so this is the only gate that catches type errors.
      - run: bun run build

      # Prod bundles (cli bundles core+client, daemon bundles core), then pack
      # each publishable package with `bun pm pack` — run INSIDE this job while
      # the workspace is present, so bun resolves every `workspace:*` (deps AND
      # devDeps) to the concrete version. The tarballs are the exact bytes we
      # publish later. Loop is driven by $PUBLISHABLE (see top of file).
      - name: Build prod bundles and pack tarballs
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist-tarballs"
          for entry in $PUBLISHABLE; do
            dir="${entry%%:*}"
            echo "::group::pack $dir"
            (cd "$dir" && bun run build:prod)
            (cd "$dir" && bun pm pack --destination "$GITHUB_WORKSPACE/dist-tarballs")
            echo "::endgroup::"
          done
          ls -l "$GITHUB_WORKSPACE/dist-tarballs"

      # Full suite (core + cli + daemon + client).
      - run: bun run test

      # Hand the built tarballs to the publish job. Skipped under `act` (the
      # pre-push dry-run has no artifact server) — the gate's value there is the
      # build+test+pack above, not the plumbing.
      - name: Upload tarballs
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: dist-tarballs
          path: dist-tarballs/*.tgz
          retention-days: 7
          if-no-files-found: error

  # ── Publish ───────────────────────────────────────────────────────────────
  # `needs: build-test` — this job literally cannot start unless the gate passed.
  # It publishes the tarballs the gate produced (never re-packs), idempotently,
  # via `npm publish` to keep npm's OIDC trusted publishing + provenance.
  publish:
    needs: build-test
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write   # OIDC trusted publishing (npm) + provenance
      contents: write   # metrics-snapshot commit + GitHub release
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      # npmjs registry for OIDC trusted publishing (no NODE_AUTH_TOKEN needed).
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Token-less OIDC trusted publishing needs npm >= 11.5.1. Node 24 ships a
      # new-enough npm today, but pin explicitly so a future runner image with an
      # older bundled npm can't fail auth on the actual publish.
      - run: npm install -g npm@latest

      - run: bun install --frozen-lockfile

      - name: Download tarballs
        if: ${{ !env.ACT }}
        uses: actions/download-artifact@v4
        with:
          name: dist-tarballs
          path: dist-tarballs

      # Idempotent publish, in dependency order (see $PUBLISHABLE). For each
      # package: if that exact version is already on the registry, skip it;
      # otherwise `npm publish <tarball> --provenance`. This makes a partial
      # release safely re-runnable — re-pushing the tag republishes only what
      # didn't make it, and never double-publishes what did.
      - name: Publish tarballs
        if: ${{ !env.ACT }}
        run: |
          set -euo pipefail
          for entry in $PUBLISHABLE; do
            name="${entry##*:}"
            # Match "${name}-<version>.tgz" only. The version starts with a digit,
            # so this never matches a longer sibling name (e.g. a future
            # "diffstalker-web-*.tgz" won't be caught by the "diffstalker" glob).
            tgz=$(ls dist-tarballs/${name}-[0-9]*.tgz)
            version=$(tar -xzOf "$tgz" package/package.json \
              | node -pe "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
            existing=$(npm view "${name}@${version}" version 2>/dev/null || true)
            if [ -n "$existing" ]; then
              echo "skip: ${name}@${version} already published"
            else
              echo "publish: ${name}@${version}"
              npm publish "$tgz" --provenance --access public
            fi
          done

      # The user-facing release lands RIGHT AFTER publish, before any
      # bookkeeping — so a successful npm publish always produces a GitHub
      # Release, and nothing after `npm publish` can prevent it.
      - name: Create GitHub Release
        if: ${{ !env.ACT }}
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

      # Post-publish bookkeeping. Non-fatal by construction: the packages are
      # already on npm and the release already exists, so a metrics hiccup
      # (snapshot error, main moved, protected branch) must not red the job.
      # `continue-on-error` isolates the whole step; the resilient push swallows
      # a non-fast-forward rather than aborting.
      - name: Commit metrics snapshot
        if: ${{ !env.ACT }}
        continue-on-error: true
        run: |
          bun run metrics:snapshot
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add metrics/
          git commit -m "Add metrics snapshot for ${{ github.ref_name }}" || true
          git fetch origin main && git rebase origin/main || true
          git push origin HEAD:main || echo "metrics push skipped (non-fatal)"
