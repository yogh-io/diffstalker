name: Release

on:
  push:
    tags:
      - 'v*'

# Publishable packages, in DEPENDENCY ORDER (a dependency before its dependents).
# This one list drives the whole flow: build:prod + pack (gate job) and publish
# (publish job) all iterate it. Adding the coming web http package is a one-line
# change here — nothing else in this file needs to know about it.
#   - `dir`  : workspace directory (build:prod + bun pm pack run here)
#   - `name` : published npm package name (used for the idempotency check + tarball glob)
env:
  # Space-separated "dir:name" pairs. daemon before cli: the cli depends on
  # diffstalkerd (workspace:*, published as the exact version), so the daemon
  # must reach the registry first. Add e.g. "packages/web:@diffstalker/web" here.
  # NOTE: packages/grammars (diffstalkerd-grammars) is NOT here yet, and
  # adding it before it exists on the registry would fail the release.
  # npm's OIDC trusted publishing cannot perform a package's FIRST publish —
  # a trusted publisher can only be configured on a package that already
  # exists. Sequence, once: publish 0.0.0 manually with a temporary granular
  # token, configure the trusted publisher on npmjs.com (repo, workflow
  # `release.yml`, environment `npm`), revoke the token, THEN add
  # "packages/grammars:diffstalkerd-grammars" here and teach scripts/release.ts
  # to version it in lockstep like the other two.
  PUBLISHABLE: "packages/daemon:diffstalkerd packages/cli:diffstalker"

jobs:
  # ── Gate ──────────────────────────────────────────────────────────────────
  # Everything must build and test green BEFORE anything ships. This job type-
  # checks all packages, prod-bundles + packs each publishable one, runs the
  # full test suite, and uploads the tarballs. If ANY step fails the job fails
  # and `publish` (which `needs` it) never starts — no partial release.
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      # Fetch the tree-sitter grammars against their pinned checksums. Needed
      # before the smoke test, whose outline half is not optional: it is the
      # only check that exercises the packed worker bundle, the vendored wasm
      # and the query files together, and that combination has silently failed
      # to reach a published daemon before.
      - name: Vendor grammars
        run: cd packages/grammars && bun run vendor

      # tsc -b across all packages (core -> cli, core -> daemon). bun test strips
      # types without checking, so this is the only gate that catches type errors.
      - run: bun run build

      # Prod bundles (cli bundles core+client, daemon bundles core), then pack
      # each publishable package with `bun pm pack` — run INSIDE this job while
      # the workspace is present, so bun resolves every `workspace:*` (deps AND
      # devDeps) to the concrete version. The tarballs are the exact bytes we
      # publish later. Loop is driven by $PUBLISHABLE (see top of file).
      - name: Build prod bundles and pack tarballs
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist-tarballs"
          for entry in $PUBLISHABLE; do
            dir="${entry%%:*}"
            echo "::group::pack $dir"
            (cd "$dir" && bun run build:prod)
            (cd "$dir" && bun pm pack --destination "$GITHUB_WORKSPACE/dist-tarballs")
            echo "::endgroup::"
          done
          ls -l "$GITHUB_WORKSPACE/dist-tarballs"

      # Pin-guard: every published package that depends on another published
      # package must pin it at the EXACT release version (lockstep). This is the
      # backstop for the bun-pm-pack-reads-a-stale-lockfile bug that shipped
      # diffstalker@0.5.0 pinning diffstalkerd@0.4.0. If any sibling pin is not
      # the tarball's own version, fail the gate — nothing publishes.
      - name: Verify workspace-sibling pins are exact
        run: |
          set -euo pipefail
          names=""
          for entry in $PUBLISHABLE; do names="$names ${entry##*:}"; done
          for entry in $PUBLISHABLE; do
            name="${entry##*:}"
            tgz=$(ls "$GITHUB_WORKSPACE"/dist-tarballs/${name}-[0-9]*.tgz)
            tar -xzOf "$tgz" package/package.json | node -e '
              const pkg = JSON.parse(require("fs").readFileSync(0, "utf8"));
              const siblings = process.argv[1].trim().split(/\s+/);
              const deps = pkg.dependencies || {};
              let bad = false;
              for (const [d, spec] of Object.entries(deps)) {
                if (siblings.includes(d) && spec !== pkg.version) {
                  console.error(`PIN MISMATCH: ${pkg.name}@${pkg.version} pins ${d}@${spec} (expected ${pkg.version})`);
                  bad = true;
                }
              }
              if (bad) process.exit(1);
              console.log(`${pkg.name}@${pkg.version}: workspace-sibling pins OK`);
            ' "$names"
          done

      # Install the packed tarballs with npm and BOOT them under Node.
      #
      # Everything above this step runs under bun, so without it CI never once
      # executes the published Node program on the runtime its users actually
      # have — a regression bun polyfills and Node does not would ship green.
      #
      # It is also the only check that catches a tarball missing dist/web. The
      # daemon's web assets are copied in by ITS OWN build:prod; a plain
      # `bun run build` leaves them out, and the resulting tarball installs
      # cleanly and then dies on first run with ERR_MODULE_NOT_FOUND. Nothing
      # else here asserts the bundle replaced the tsc output.
      #
      # Both the floor from `engines` and current Node, because the floor is a
      # claim we make to consumers and nothing else tests it.
      - name: Smoke-test the tarballs under Node
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/smoke.sh" <<'SMOKE'
          set -euo pipefail
          node --version
          work=$(mktemp -d)
          cd "$work"
          npm init -y >/dev/null
          npm i --no-audit --no-fund "$GITHUB_WORKSPACE"/dist-tarballs/*.tgz >/dev/null
          export PATH="$work/node_modules/.bin:$PATH"

          # The bundled web UI must be present, or GET / serves nothing.
          test -f node_modules/diffstalkerd/dist/web/index.html \
            || { echo "FAIL: daemon tarball has no dist/web/index.html"; exit 1; }

          # The symbol worker is a SEPARATE bundle beside the entry point, and
          # a files-field slip is invisible until someone presses `o`.
          test -f node_modules/diffstalkerd/dist/symbolWorker.js \
            || { echo "FAIL: daemon tarball has no dist/symbolWorker.js"; exit 1; }

          diffstalkerd --version
          diffstalker --version

          # Boot it the way a user does, on an explicit socket so the runner's
          # missing XDG_RUNTIME_DIR is not what we end up testing.
          port=7391
          diffstalkerd --socket "$work/d.sock" --port "$port" --no-follow --no-update-check &
          daemon=$!
          trap 'kill "$daemon" 2>/dev/null || true' EXIT
          for i in $(seq 1 50); do
            curl -fsS "http://127.0.0.1:$port/health" >/dev/null 2>&1 && break
            sleep 0.2
          done
          curl -fsS "http://127.0.0.1:$port/health"

          # GET / must serve the SPA, and every asset it references must resolve.
          # A files-field slip shows up here and nowhere else.
          curl -fsS "http://127.0.0.1:$port/" -o index.html
          grep -q '<div id="app"' index.html || { echo "FAIL: GET / is not the SPA"; exit 1; }
          grep -oE '(src|href)="/[^"]+"' index.html | cut -d'"' -f2 | sort -u | while read -r asset; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$port$asset")
            [ "$code" = "200" ] || { echo "FAIL: asset $asset -> $code"; exit 1; }
            echo "  ok $asset"
          done
          # --- Outlines: both halves, because each fails differently. ---
          #
          # The grammars are an OPT-IN package, so the daemon must first be
          # correct WITHOUT them (capability empty, no outline offered), and
          # then correct WITH them. Only the second half exercises the packed
          # worker bundle, the vendored wasm and the query files together —
          # and that combination is the one that has silently failed to reach
          # a published daemon before.
          caps=$(curl -fsS "http://127.0.0.1:$port/health" | node -pe "JSON.parse(require('fs').readFileSync(0,'utf8')).symbols.extensions.length")
          [ "$caps" = "0" ] || { echo "FAIL: bare daemon advertises $caps outline extensions"; exit 1; }
          echo "  ok no grammars -> no capability"

          # Now with the grammars, against a real repo and a known symbol.
          grammars="$GITHUB_WORKSPACE/packages/grammars"
          test -f "$grammars/checksums.json" \
            || { echo "FAIL: grammars not vendored — the outline gate cannot run"; exit 1; }
          {
            kill "$daemon" 2>/dev/null || true
            wait "$daemon" 2>/dev/null || true

            fixture="$work/fixture"
            mkdir -p "$fixture"
            git -C "$fixture" init -q .
            printf 'export class Widget {\n  render(): number { return 1; }\n}\n' > "$fixture/a.ts"
            git -C "$fixture" add -A
            git -C "$fixture" -c user.email=ci@ci -c user.name=ci commit -qm fixture

            port=7392
            diffstalkerd --socket "$work/d2.sock" --port "$port" --no-follow --no-update-check \
              --grammars "$grammars" &
            daemon=$!
            for i in $(seq 1 50); do
              curl -fsS "http://127.0.0.1:$port/health" >/dev/null 2>&1 && break
              sleep 0.2
            done

            id=$(curl -fsS -X POST "http://127.0.0.1:$port/repos" \
              -H 'content-type: application/json' \
              -d "{\"path\":\"$fixture\"}" \
              | node -pe "JSON.parse(require('fs').readFileSync(0,'utf8')).id")

            out=$(curl -fsS "http://127.0.0.1:$port/repos/$id/file?path=a.ts&symbols=true")
            echo "$out" | grep -q '"status":"ok"' \
              || { echo "FAIL: outline not ok: $out"; exit 1; }
            echo "$out" | grep -q '"name":"render"' \
              || { echo "FAIL: outline missing a known symbol: $out"; exit 1; }
            echo "  ok grammars -> real symbols from the packed tarball"
          }

          echo "smoke OK on $(node --version)"
          SMOKE
          chmod +x "$RUNNER_TEMP/smoke.sh"

      - uses: actions/setup-node@v6
        with:
          node-version: '20.19.0'
      - run: bash "$RUNNER_TEMP/smoke.sh"

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: bash "$RUNNER_TEMP/smoke.sh"

      # Full suite (core + cli + daemon + client).
      - run: bun run test

      # Hand the built tarballs to the publish job. Skipped under `act` (the
      # pre-push dry-run has no artifact server) — the gate's value there is the
      # build+test+pack above, not the plumbing.
      - name: Upload tarballs
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v7
        with:
          name: dist-tarballs
          path: dist-tarballs/*.tgz
          retention-days: 7
          if-no-files-found: error

  # ── Publish ───────────────────────────────────────────────────────────────
  # `needs: build-test` — this job literally cannot start unless the gate passed.
  # It publishes the tarballs the gate produced (never re-packs), idempotently,
  # via `npm publish` to keep npm's OIDC trusted publishing + provenance.
  publish:
    needs: build-test
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write   # OIDC trusted publishing (npm) + provenance
      contents: write   # metrics-snapshot commit + GitHub release
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      # npmjs registry for OIDC trusted publishing (no NODE_AUTH_TOKEN needed).
      # node 24's bundled npm (>= 11.9) already satisfies token-less OIDC
      # trusted publishing (needs >= 11.5.1), so we do NOT upgrade npm here:
      # `npm install -g npm@latest` pulls npm 12, whose engine requires a newer
      # node than setup-node provides, and fails. Use the bundled npm as-is.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - run: bun install --frozen-lockfile

      - name: Download tarballs
        if: ${{ !env.ACT }}
        uses: actions/download-artifact@v8
        with:
          name: dist-tarballs
          path: dist-tarballs

      # Idempotent publish, in dependency order (see $PUBLISHABLE). For each
      # package: if that exact version is already on the registry, skip it;
      # otherwise `npm publish <tarball> --provenance`. This makes a partial
      # release safely re-runnable — re-pushing the tag republishes only what
      # didn't make it, and never double-publishes what did.
      - name: Publish tarballs
        if: ${{ !env.ACT }}
        run: |
          set -euo pipefail
          for entry in $PUBLISHABLE; do
            name="${entry##*:}"
            # Match "${name}-<version>.tgz" only. The version starts with a digit,
            # so this never matches a longer sibling name (e.g. a future
            # "diffstalker-web-*.tgz" won't be caught by the "diffstalker" glob).
            # Absolute path: `npm publish <tarball>` treats a bare "a/b" string
            # as a github owner/repo shorthand, so a relative "dist-tarballs/x.tgz"
            # gets cloned instead of published. An absolute path is unambiguous.
            tgz=$(ls "$GITHUB_WORKSPACE"/dist-tarballs/${name}-[0-9]*.tgz)
            version=$(tar -xzOf "$tgz" package/package.json \
              | node -pe "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
            existing=$(npm view "${name}@${version}" version 2>/dev/null || true)
            if [ -n "$existing" ]; then
              echo "skip: ${name}@${version} already published"
            else
              echo "publish: ${name}@${version}"
              npm publish "$tgz" --provenance --access public
            fi
          done

      # The user-facing release lands RIGHT AFTER publish, before any
      # bookkeeping — so a successful npm publish always produces a GitHub
      # Release, and nothing after `npm publish` can prevent it.
      - name: Create GitHub Release
        if: ${{ !env.ACT }}
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true

      # Post-publish bookkeeping. Non-fatal by construction: the packages are
      # already on npm and the release already exists, so a metrics hiccup
      # (snapshot error, main moved, protected branch) must not red the job.
      # `continue-on-error` isolates the whole step; the resilient push swallows
      # a non-fast-forward rather than aborting.
      - name: Commit metrics snapshot
        if: ${{ !env.ACT }}
        continue-on-error: true
        run: |
          bun run metrics:snapshot
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add metrics/
          git commit -m "Add metrics snapshot for ${{ github.ref_name }}" || true
          git fetch origin main && git rebase origin/main || true
          git push origin HEAD:main || echo "metrics push skipped (non-fatal)"
