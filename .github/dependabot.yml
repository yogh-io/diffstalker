version: 2

# One monthly PR that carries every bun and Actions bump together.
multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: "monthly"

updates:
  # Bun workspace (root drives all packages/* and owns bun.lock).
  - package-ecosystem: "bun"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"
    ignore:
      # TypeScript major upgrades need coordinated vue-tsc/typescript-eslint
      # upgrades; TS 7 removes the ./lib/tsc entry point used by vue-tsc 3.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
      # This runtime version is coupled to vendored grammar artifacts and the
      # BUNDLED_WEB_TREE_SITTER constant; update those together deliberately.
      - dependency-name: "web-tree-sitter"

  # Keep the Actions used by the CI / release / CodeQL workflows current.
  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"
