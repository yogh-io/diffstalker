<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>diffstalker</title>
  </head>
  <body>
    <div id="app"></div>
    <!-- Portrait toolbar Teleport target. It lives OUTSIDE the Vue tree
         so it exists whenever a view's <Teleport> mounts — a target
         rendered inside the tree can be missing at that moment (HMR
         remounts, first-patch mounts), which mounts the children
         nowhere and crashes every later patch. ActivityRail adopts this
         element into the portrait tab band on mount and parks it back
         here on unmount; it is display:none while parked. -->
    <div id="view-toolbar-slot" class="toolbar-slot"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
